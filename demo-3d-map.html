<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2.5D რუკა — საცდელი</title>
<!-- საცდელი გვერდი (საიტს არ ეკუთვნის): რუკა კოდით აწყობილ 3D-ში (Three.js), ავტორის სურათის (public/game/ვერს/) ანალოგი —
     შენობების, გალავნის, ჯარის და გემების გარეშე. დარჩა: ზღვა, მდინარე, ხიდები, გზები, ტყე, მინდვრები, მთები, ბრძოლის ველის მიწა.
     ფაქტურები იხატება კოდით (canvas), სურათები არ იტვირთება. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe3ef; font-family: system-ui, sans-serif; }
  canvas { display: block; touch-action: none; }
  .ui { position: fixed; left: 16px; top: 16px; right: 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .ui h1 { margin: 0 8px 0 0; font-size: 16px; color: #fff; text-shadow: 0 1px 3px #000c; }
  button { font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 999px; border: 1px solid #d9b46a; background: #2a2340e6; color: #f4e6c4; cursor: pointer; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; color: #2a2340; font-size: 18px; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<div class="loading" id="loading">რუკა იხატება…</div>
<div class="ui"><h1>საცდელი 2.5D რუკა — შენობების გარეშე</h1><button id="night">☾ ღამე</button></div>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------- რენდერერი, კამერა ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const FOG_DAY = new THREE.Color('#cfe3ef'), FOG_NIGHT = new THREE.Color('#0d1430');
scene.fog = new THREE.Fog(FOG_DAY.clone(), 205, 360);
// 2.5D: ფიქსირებული კუთხე, ორთოგრაფიული კამერა (შორს მყოფი არ პატარავდება); ტრიალი / ზუმი არ არის — რუკა თავად ერგება ეკრანს
const PITCH = THREE.MathUtils.degToRad(34), CAM_D = 220, TARGET = new THREE.Vector3(3, 0, -9);
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 2000);
camera.position.copy(TARGET).add(new THREE.Vector3(0, Math.sin(PITCH), Math.cos(PITCH)).multiplyScalar(CAM_D));
camera.lookAt(TARGET); camera.updateMatrixWorld();
// KEY — რაც ყოველთვის უნდა ჩანდეს; MAX — მეტი არ გამოჩნდეს (მიწის კიდის მიღმა ცარიელია)
const viewBox = (x0, x1, z0, z1, y0, y1) => {
  const b = new THREE.Box3();
  for (const x of [x0, x1]) for (const z of [z0, z1]) for (const y of [y0, y1]) b.expandByPoint(new THREE.Vector3(x, y, z).applyMatrix4(camera.matrixWorldInverse));
  return b;
};
const KEY = viewBox(-30, 36, -27, 20, 0, 12), MAX = viewBox(-56, 56, -48, 32, 0, 16);
function fitView() {
  const a = innerWidth / innerHeight, kw = KEY.max.x - KEY.min.x, kh = KEY.max.y - KEY.min.y;
  let w = kw, h = kh;
  if (a > kw / kh) w = h * a; else h = w / a;
  const mw = MAX.max.x - MAX.min.x, mh = MAX.max.y - MAX.min.y;
  if (h > mh) { h = mh; w = h * a; }               // ვიწრო (ვერტიკალური) ეკრანი — გვერდები იჭრება, ცარიელი ზოლები არ ჩანს
  if (w > mw) { w = mw; h = w / a; }               // ძალიან განიერი — ზედა / ქვედა იჭრება
  const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);               // ხედი მიწის საზღვრებს არ სცდება
  const cx = clamp((KEY.min.x + KEY.max.x) / 2, MAX.min.x + w / 2, MAX.max.x - w / 2), cy = clamp((KEY.min.y + KEY.max.y) / 2, MAX.min.y + h / 2, MAX.max.y - h / 2);
  Object.assign(camera, { left: cx - w / 2, right: cx + w / 2, top: cy + h / 2, bottom: cy - h / 2 });
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
fitView();
addEventListener('resize', fitView);

// ---------- ხმაური, დამხმარეები ----------
function hash(ix, iz) { let h = (Math.imul(ix, 374761393) + Math.imul(iz, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z), fx = x - ix, fz = z - iz, u = fx * fx * (3 - 2 * fx), v = fz * fz * (3 - 2 * fz);
  const a = hash(ix, iz), b = hash(ix + 1, iz), c = hash(ix, iz + 1), d = hash(ix + 1, iz + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, z, o = 4) { let s = 0, a = .5, f = 1, n = 0; for (let i = 0; i < o; i++) { s += a * vnoise(x * f, z * f); n += a; f *= 2.03; a *= .5; } return s / n; }
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry32(20597), rnd = (a, b) => a + rng() * (b - a);
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const densify = (pts, n) => new THREE.CatmullRomCurve3(pts.map(([x, z]) => new THREE.Vector3(x, 0, z))).getPoints(n).map(p => [p.x, p.z]);
function distPoly(x, z, P) {
  let best = 1e9;
  for (let i = 0; i < P.length - 1; i++) {
    const [ax, az] = P[i], [bx, bz] = P[i + 1], dx = bx - ax, dz = bz - az, L = dx * dx + dz * dz;
    const t = L ? Math.max(0, Math.min(1, ((x - ax) * dx + (z - az) * dz) / L)) : 0;
    const ex = ax + dx * t - x, ez = az + dz * t - z, d = ex * ex + ez * ez;
    if (d < best) best = d;
  }
  return Math.sqrt(best);
}
function inside(x, z, poly) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, zi] = poly[i], [xj, zj] = poly[j];
    if ((zi > z) !== (zj > z) && x < (xj - xi) * (z - zi) / (zj - zi) + xi) c = !c;
  }
  return c;
}

// ---------- რუკის განლაგება (მსოფლიოს ერთეულებში; x — მარჯვნივ, z — მაყურებლისკენ, ჩრდილოეთი = -z) ----------
// ზღვა — ზედა მარცხნივ, ნაპირი მიდის შორეული მთებიდან მარცხენა კიდემდე
const COAST = densify([[-14, -50], [-9, -36], [-5, -27], [-3, -20], [-1.2, -16], [-2, -13.2], [-4, -12], [-6.5, -11.6], [-9, -10.3], [-11.5, -8],
  [-12.5, -5.5], [-15.5, -4.2], [-20, -4.4], [-25, -3.2], [-31, -1.6], [-40, -.4], [-62, 0]], 300);
const SEA = [...COAST, [-62, -70], [-14, -70]];
// მდინარე — ზღვიდან (ხიდთან) სამხრეთ-აღმოსავლეთით, ქვედა კიდემდე
const RIVER = densify([[-3.2, -13.8], [-2.4, -10.5], [-1.5, -7], [-1, -4.5], [-.2, -2], [1, 0], [2.1, 2.6], [3.7, 4.9], [5.5, 7], [6.9, 9.6],
  [8.1, 12.6], [9.6, 16], [10.8, 20], [11.8, 26], [12.5, 34]], 300);
const RW = .6;                                         // მდინარის ნახევარსიგანე (ფსკერი); ნაპირიანად ~2.3
// ხიდები მდინარის წერტილებზე; ღერძი — მდინარის მართობულად
const BRIDGE_LEN = 4.2;
const BRIDGES = [[-1.5, -7], [1, 0], [5.5, 7]].map(([x, z]) => {
  let best = 0, bd = 1e9;
  RIVER.forEach(([px, pz], i) => { const d = (px - x) ** 2 + (pz - z) ** 2; if (d < bd) { bd = d; best = i; } });
  const [ax, az] = RIVER[Math.max(0, best - 3)], [bx, bz] = RIVER[Math.min(RIVER.length - 1, best + 3)];
  const tl = Math.hypot(bx - ax, bz - az), tx = (bx - ax) / tl, tz = (bz - az) / tl;
  let px = tz, pz = -tx; if (px < 0) { px = -px; pz = -pz; }                 // ღერძი დასავლეთიდან აღმოსავლეთისკენ
  const h = BRIDGE_LEN / 2 + .1;
  return { x, z, ax: px, az: pz, w: [x - px * h, z - pz * h], e: [x + px * h, z + pz * h] };
});
const [B1, B2, B3] = BRIDGES;
const ROADS = [
  [B1.e, [2.5, -8.6], [4.2, -10.3], [5.2, -11.6]],                                                       // ციხის აღმართი
  [B1.e, [3.5, -6.6], [7, -5], [11, -2.8], [14, -.2], [17, 2.8], [21, 6.3], [26, 10.2], [32, 14.6], [44, 22]], // მთავარი გზა სამხრეთ-აღმოსავლეთით
  [B1.w, [-5.6, -6.8], [-8.2, -5.2], [-10, -2.4], [-10.2, .6], [-7.6, 2.4], [-4, 2], B2.w],                // დასავლეთის მარყუჟი
  [B2.e, [5, -1.3], [8, -2], [11, -2.8]],
  [[-10.1, -.8], [-13.5, .8], [-17.5, 2.6], [-22, 4.8], [-27, 7.5]],                                     // ბრძოლის ველისკენ
  [[-7, 8.6], [-3.5, 8.4], [0, 8.4], B3.w],
  [B3.e, [9.5, 4.8], [12, 3.4], [14, 1.8], [15.6, 1.3]]
].map(r => densify(r, 90));
// ბრძოლის ველი — გათელილი მიწა მარცხენა ქვედა ნაწილში (გალავნის ადგილის გარეთ)
const BATTLE = [[-62, 5], [-30, .5], [-24, 1.5], [-18, 5.5], [-13, 10.5], [-10, 16], [-8, 30], [-62, 30]];
// მინდვრები — მთავარი გზის გასწვრივ, სამხრეთ-აღმოსავლეთით
const FIELD_C = [19, 8.4], FIELD_A = Math.atan2(3.5, 4);
const FIELDS = [];
for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++) FIELDS.push({ u: -6 + i * 3.4, v: 1.9 + j * 2.4, w: 3.1, h: 2.1, kind: (i * 3 + j * 2) % 5 });
const toField = (x, z) => { const dx = x - FIELD_C[0], dz = z - FIELD_C[1], c = Math.cos(FIELD_A), s = Math.sin(FIELD_A); return [dx * c + dz * s, -dx * s + dz * c]; };
const inField = (x, z) => { const [u, v] = toField(x, z); return FIELDS.some(f => Math.abs(u - f.u) < f.w / 2 + .3 && Math.abs(v - f.v) < f.h / 2 + .3); };
// შენობების ადგილები — ცარიელი მოედნები (ციხე, ეკლესია, სასახლე, მაღაზია)
const CLEAR = [[5, -13.6, 5.2], [13, -5.2, 2.6], [9, 2.6, 3], [-7.5, -8.7, 2]];

// ---------- სიმაღლე ----------
function landHeight(x, z) {
  let h = .5 + (fbm(x * .07 + 3, z * .07 + 7, 3) - .5) * 1.1;
  h += 1.7 * smooth(1.25, .7, Math.hypot((x - 5) / 6, (z + 13.6) / 4.6));       // ციხის ბორცვი (ზედა ბრტყელი)
  h += Math.max(0, -z - 17) * .22 * smooth(-12, -5, x);                             // მიწა მთებისკენ იწევს
  h += .4 * smooth(4.5, 0, Math.hypot(x - 13, z + 5.2));
  return h;
}
function height(x, z) {
  const dc = distPoly(x, z, COAST);
  let h = inside(x, z, SEA) ? Math.max(-3, .1 - dc * .9) : .1 + (landHeight(x, z) - .1) * smooth(0, 2.4, dc);
  const dr = distPoly(x, z, RIVER);
  if (dr < RW + 1.2) h = Math.min(h, THREE.MathUtils.lerp(-.9, h, smooth(RW - .3, RW + 1.1, dr)));
  return h;
}

// ---------- მიწის ფაქტურა (canvas) ----------
const X0 = -60, X1 = 60, Z0 = -50, Z1 = 34, SX = X1 - X0, SZ = Z1 - Z0, CW = 3072, CH = Math.round(CW * SZ / SX), PX = CW / SX;
const cx = x => (x - X0) * PX, cz = z => (z - Z0) * PX;
function groundTexture() {
  const c = document.createElement('canvas'); c.width = CW; c.height = CH;
  const g = c.getContext('2d');
  // 1) ბალახი: დაბალი გარჩევადობის ხმაური → გადიდება (რბილი ლაქები)
  const lw = 480, lh = Math.round(lw * CH / CW), low = document.createElement('canvas'); low.width = lw; low.height = lh;
  const lg = low.getContext('2d'), img = lg.createImageData(lw, lh);
  for (let j = 0; j < lh; j++) for (let i = 0; i < lw; i++) {
    const x = X0 + (i + .5) / lw * SX, z = Z0 + (j + .5) / lh * SZ;
    const n = fbm(x * .12, z * .12, 3), m = fbm(x * .45 + 9, z * .45, 2), dry = smooth(.55, .78, m) * .45;
    const k = (j * lw + i) * 4;
    img.data[k] = 70 + n * 45 + dry * 55; img.data[k + 1] = 104 + n * 40 + dry * 18; img.data[k + 2] = 42 + n * 20 + dry * 10; img.data[k + 3] = 255;
  }
  lg.putImageData(img, 0, 0);
  g.imageSmoothingQuality = 'high'; g.drawImage(low, 0, 0, CW, CH);
  // წვრილი ბალახის ფაქტურა — განმეორებადი ნიმუში
  const pat = document.createElement('canvas'); pat.width = pat.height = 128;
  const pg = pat.getContext('2d');
  for (let i = 0; i < 1400; i++) { pg.fillStyle = Math.random() < .5 ? 'rgba(30,60,15,.35)' : 'rgba(170,200,100,.25)'; pg.fillRect(Math.random() * 128, Math.random() * 128, 1, 1 + Math.random() * 2); }
  g.fillStyle = g.createPattern(pat, 'repeat'); g.fillRect(0, 0, CW, CH);

  const path = (pts, close) => { g.beginPath(); pts.forEach(([x, z], i) => i ? g.lineTo(cx(x), cz(z)) : g.moveTo(cx(x), cz(z))); if (close) g.closePath(); };
  const stroke = (pts, w, col, blur = 0) => { g.filter = blur ? `blur(${blur}px)` : 'none'; g.lineCap = g.lineJoin = 'round'; g.lineWidth = w * PX; g.strokeStyle = col; path(pts); g.stroke(); g.filter = 'none'; };
  const fill = (pts, col, blur = 0) => { g.filter = blur ? `blur(${blur}px)` : 'none'; g.fillStyle = col; path(pts, true); g.fill(); g.filter = 'none'; };

  // 2) მთების ძირი — ქვიანი
  const mg = g.createLinearGradient(0, cz(-30), 0, cz(-23)); mg.addColorStop(0, 'rgba(110,104,92,1)'); mg.addColorStop(1, 'rgba(110,104,92,0)');
  g.fillStyle = mg; g.fillRect(0, 0, CW, cz(-23));
  // 3) ბრძოლის ველი — გათელილი მიწა, ლაქებით და ნაკვალევით
  fill(BATTLE, '#8c7350', 18);
  for (let i = 0; i < 900; i++) {
    const x = rnd(-60, -8), z = rnd(0, 28); if (!inside(x, z, BATTLE)) continue;
    g.fillStyle = rng() < .5 ? `rgba(70,55,35,${rnd(.1, .25)})` : `rgba(170,150,110,${rnd(.1, .22)})`;
    g.beginPath(); g.ellipse(cx(x), cz(z), rnd(.15, .6) * PX, rnd(.1, .35) * PX, rnd(0, 3), 0, 7); g.fill();
  }
  for (let i = 0; i < 260; i++) {
    const x = rnd(-60, -8), z = rnd(0, 28); if (!inside(x, z, BATTLE)) continue;
    g.strokeStyle = 'rgba(60,45,28,.25)'; g.lineWidth = 2; g.beginPath(); g.moveTo(cx(x), cz(z)); g.lineTo(cx(x + rnd(-2, 2)), cz(z + rnd(-1, 1))); g.stroke();
  }
  // 4) ცარიელი მოედნები შენობების ადგილას — ოდნავ ღია ბალახი
  for (const [x, z, r] of CLEAR) { g.filter = 'blur(10px)'; g.fillStyle = 'rgba(160,170,95,.35)'; g.beginPath(); g.arc(cx(x), cz(z), r * .8 * PX, 0, 7); g.fill(); g.filter = 'none'; }
  // 5) მინდვრები (ხორბალი / მწვანე ზოლები)
  const FIELD_COL = ['#d9ad3c', '#c9962e', '#e2be52', '#7fa645', '#d1a238'];
  for (const f of FIELDS) {
    g.save(); g.translate(cx(FIELD_C[0]), cz(FIELD_C[1])); g.rotate(FIELD_A); g.translate(f.u * PX, f.v * PX);
    const w = f.w * PX, h = f.h * PX;
    g.fillStyle = FIELD_COL[f.kind]; g.fillRect(-w / 2, -h / 2, w, h);
    g.strokeStyle = 'rgba(90,60,10,.35)'; g.lineWidth = 2;
    for (let y = -h / 2 + 4; y < h / 2; y += 6) { g.beginPath(); g.moveTo(-w / 2, y); g.lineTo(w / 2, y); g.stroke(); }
    g.strokeStyle = 'rgba(70,50,20,.5)'; g.lineWidth = 4; g.strokeRect(-w / 2, -h / 2, w, h);
    g.restore();
  }
  // 6) გზები: მუქი კიდე → ქვაფენილი → ქვები
  for (const r of ROADS) stroke(r, 1.7, 'rgba(85,70,45,.55)', 4);
  for (const r of ROADS) stroke(r, 1.05, '#a49779');
  for (const r of ROADS) for (let i = 0; i < r.length - 1; i++) for (let k = 0; k < 10; k++) {
    const t = rng(), x = r[i][0] + (r[i + 1][0] - r[i][0]) * t + rnd(-.45, .45), z = r[i][1] + (r[i + 1][1] - r[i][1]) * t + rnd(-.45, .45);
    g.fillStyle = rng() < .5 ? 'rgba(70,62,50,.35)' : 'rgba(215,205,185,.45)'; g.beginPath(); g.ellipse(cx(x), cz(z), rnd(.08, .16) * PX, rnd(.06, .12) * PX, rnd(0, 3), 0, 7); g.fill();
  }
  // 7) ზღვა და ნაპირი: ფსკერი → ქვიანი ნაპირი → ქაფი
  fill(SEA, '#2c5a62');
  stroke(COAST, 3.2, '#8f8673', 6);
  stroke(COAST, 1.2, '#b8ad92', 3);
  stroke(COAST, .35, 'rgba(240,245,240,.75)', 1);
  // 8) მდინარე: ქვიანი ნაპირები → ფსკერი
  stroke(RIVER, 2 * (RW + 1.25), '#7c7263', 5);
  for (let i = 0; i < RIVER.length; i += 1) for (let k = 0; k < 4; k++) {
    const [x, z] = RIVER[i], a = rnd(0, 6.28), d = rnd(RW + .5, RW + 1.3);
    g.fillStyle = rng() < .5 ? 'rgba(60,55,48,.5)' : 'rgba(190,182,165,.5)'; g.beginPath(); g.arc(cx(x + Math.cos(a) * d), cz(z + Math.sin(a) * d), rnd(.08, .2) * PX, 0, 7); g.fill();
  }
  stroke(RIVER, 2 * (RW + .55), '#30504e', 3);

  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

// ---------- მიწა ----------
const terrainGeo = new THREE.PlaneGeometry(SX, SZ, 300, 195);
terrainGeo.rotateX(-Math.PI / 2);
terrainGeo.translate((X0 + X1) / 2, 0, (Z0 + Z1) / 2);
{
  const p = terrainGeo.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, height(p.getX(i), p.getZ(i)));
  terrainGeo.computeVertexNormals();
}
const terrain = new THREE.Mesh(terrainGeo, new THREE.MeshStandardMaterial({ map: groundTexture(), roughness: 1 }));
terrain.receiveShadow = true; scene.add(terrain);

// ---------- წყალი (ზღვა და მდინარე ერთი სიბრტყეა; ტალღები — მოძრავი normal map) ----------
function waterNormals(size = 256) {
  const waves = Array.from({ length: 14 }, () => ({ kx: Math.round(rnd(-6, 6)), ky: Math.round(rnd(1, 9)), a: rnd(.3, 1), p: rnd(0, 6.28) }));
  const hgt = (x, y) => waves.reduce((s, w) => s + w.a * Math.sin(2 * Math.PI * (w.kx * x + w.ky * y) / size + w.p), 0);
  const data = new Uint8Array(size * size * 4);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const dx = hgt(x + 1, y) - hgt(x - 1, y), dy = hgt(x, y + 1) - hgt(x, y - 1), n = new THREE.Vector3(-dx * .35, -dy * .35, 1).normalize(), k = (y * size + x) * 4;
    data[k] = (n.x * .5 + .5) * 255; data[k + 1] = (n.y * .5 + .5) * 255; data[k + 2] = (n.z * .5 + .5) * 255; data[k + 3] = 255;
  }
  const t = new THREE.DataTexture(data, size, size); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(60, 60); t.needsUpdate = true;
  return t;
}
const WATER_DAY = new THREE.Color('#2d6f9e'), WATER_NIGHT = new THREE.Color('#2a4f86');
const waterMat = new THREE.MeshStandardMaterial({ color: WATER_DAY.clone(), roughness: .16, metalness: .1, normalMap: waterNormals(), normalScale: new THREE.Vector2(.55, .55), transparent: true, opacity: .9 });
const water = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), waterMat);
water.rotation.x = -Math.PI / 2; water.receiveShadow = true; scene.add(water);

// ---------- ხიდები (ხის, თაღოვანი) ----------
const M = o => new THREE.MeshStandardMaterial({ roughness: .9, ...o });
const BOX = new THREE.BoxGeometry(1, 1, 1);
const plankMat = M({ color: '#8a5d38' }), railMat = M({ color: '#5a3a22' }), stoneMat = M({ color: '#8d8576', flatShading: true });
for (const B of BRIDGES) {
  const g = new THREE.Group(); g.position.set(B.x, 0, B.z); g.rotation.y = Math.atan2(-B.az, B.ax);
  const L = BRIDGE_LEN, N = 10, arc = .6, y0 = .45, Y = t => y0 + arc * (1 - (2 * t) ** 2);
  for (let i = 0; i < N; i++) {
    const t0 = i / N - .5, t1 = (i + 1) / N - .5, yA = Y(t0), yB = Y(t1), dx = (t1 - t0) * L, len = Math.hypot(dx, yB - yA), ang = Math.atan2(yB - yA, dx);
    const deck = new THREE.Mesh(BOX, plankMat); deck.scale.set(len + .03, .14, 1.3); deck.position.set((t0 + t1) / 2 * L, (yA + yB) / 2, 0); deck.rotation.z = ang; g.add(deck);
    for (const s of [-1, 1]) {
      const rail = new THREE.Mesh(BOX, railMat); rail.scale.set(len + .03, .08, .08); rail.position.set(deck.position.x, deck.position.y + .45, s * .6); rail.rotation.z = ang; g.add(rail);
      const post = new THREE.Mesh(BOX, railMat); post.scale.set(.09, .48, .09); post.position.set(t0 * L, yA + .24, s * .6); g.add(post);
      if (i === N - 1) { const p2 = post.clone(); p2.position.set(t1 * L, yB + .24, s * .6); g.add(p2); }
    }
  }
  for (const s of [-1, 1]) { const a = new THREE.Mesh(BOX, stoneMat); a.scale.set(.9, .9, 1.6); a.position.set(s * (L / 2 - .15), .05, 0); g.add(a); }
  g.traverse(o => { if (o.isMesh) o.castShadow = o.receiveShadow = true; });
  scene.add(g);
}

// ---------- ტყე (ერთი InstancedMesh — ათასობით ნაძვი, სწრაფად) ----------
const paint = (geo, [r, g, b]) => { const n = geo.attributes.position.count, a = new Float32Array(n * 3); for (let i = 0; i < n; i++) a.set([r, g, b], i * 3); geo.setAttribute('color', new THREE.BufferAttribute(a, 3)); return geo; };
function pineGeometry() {
  const parts = [paint(new THREE.CylinderGeometry(.08, .12, .6, 5).translate(0, .3, 0), [.3, .2, .12])];
  for (let i = 0; i < 3; i++) {
    const r = .78 - i * .2, hh = 1.05 - i * .12;
    parts.push(paint(new THREE.ConeGeometry(r, hh, 7).translate(0, .55 + i * .5 + hh / 2, 0), [.11 + .03 * i, .27 + .04 * i, .11]));
  }
  return mergeGeometries(parts);
}
const E = (x, z, ex, ez, rx, rz) => smooth(1, .55, Math.hypot((x - ex) / rx, (z - ez) / rz));
function forestDensity(x, z) {
  let p = .05;
  p += .95 * E(x, z, -17, -1, 6.5, 3.2);                                   // ნაპირსა და ბრძოლის ველს შორის
  p += .9 * E(x, z, -5, -3.4, 3.2, 2.6);                                   // მარყუჟის შიგნით
  p += .85 * smooth(-12.5, -15, z) * smooth(-23.5, -21.5, z) * smooth(-3, 0, x); // ციხის უკან, მთების ძირამდე
  p += .85 * E(x, z, 1.5, 13.5, 6, 4.5);
  p += .7 * E(x, z, 16, 17.5, 7, 3.5);
  p += .7 * E(x, z, 29, 6, 5, 8);
  p += .5 * E(x, z, 22, -7, 6, 5);
  p += .4 * E(x, z, -2, 5, 3, 2);
  if (inside(x, z, BATTLE)) p *= .06;
  return Math.min(p, .95);
}
function treeOK(x, z) {
  if (inside(x, z, SEA) || distPoly(x, z, COAST) < 1.8) return false;
  if (distPoly(x, z, RIVER) < RW + 1.5) return false;
  if (ROADS.some(r => distPoly(x, z, r) < 1.15)) return false;
  if (inField(x, z)) return false;
  if (CLEAR.some(([cx2, cz2, r]) => Math.hypot(x - cx2, z - cz2) < r)) return false;
  return true;
}
const trees = [];
for (let x = -46; x < 50; x += .8) for (let z = -47; z < 26; z += .8) {
  const px = x + rnd(-.35, .35), pz = z + rnd(-.35, .35);
  if (rng() > forestDensity(px, pz) || !treeOK(px, pz)) continue;
  trees.push([px, pz, rnd(.7, 1.15)]);
}
const forest = new THREE.InstancedMesh(pineGeometry(), M({ vertexColors: true, flatShading: true }), trees.length);
{
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3(), col = new THREE.Color();
  trees.forEach(([x, z, k], i) => {
    q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), rnd(0, 6.28)); s.set(k, k * rnd(.9, 1.2), k); p.set(x, height(x, z) - .05, z);
    forest.setMatrixAt(i, m.compose(p, q, s));
    forest.setColorAt(i, col.setHSL(rnd(.28, .36), rnd(.25, .45), rnd(.5, .62)).multiplyScalar(1.15));
  });
}
forest.castShadow = forest.receiveShadow = true; scene.add(forest);

// ---------- ქვები ნაპირებზე ----------
const rocks = [];
for (let i = 0; i < COAST.length; i += 2) { const [x, z] = COAST[i]; if (x < -45 || z < -30) continue; for (let k = 0; k < 2; k++) rocks.push([x + rnd(-1.2, 1.2), z + rnd(-1.2, 1.2), rnd(.25, .75)]); }
for (let i = 0; i < RIVER.length; i += 2) { const [x, z] = RIVER[i]; if (BRIDGES.some(B => Math.hypot(x - B.x, z - B.z) < 1.6)) continue; for (const s of [-1, 1]) { const a = rnd(0, 6.28), d = RW + rnd(.7, 1.3); rocks.push([x + Math.cos(a) * d * s, z + Math.sin(a) * d * s, rnd(.15, .4)]); } }
const rockMesh = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1, 0), M({ color: '#9a9284', flatShading: true }), rocks.length);
{
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3(), col = new THREE.Color();
  rocks.forEach(([x, z, k], i) => {
    q.setFromEuler(new THREE.Euler(rnd(0, 3), rnd(0, 3), rnd(0, 3))); s.set(k * rnd(.8, 1.3), k * rnd(.5, .8), k * rnd(.8, 1.3)); p.set(x, Math.max(height(x, z), -.4), z);
    rockMesh.setMatrixAt(i, m.compose(p, q, s)); rockMesh.setColorAt(i, col.setScalar(rnd(.75, 1.1)));
  });
}
rockMesh.castShadow = rockMesh.receiveShadow = true; scene.add(rockMesh);

// ---------- მთები (თოვლიანი მწვერვალები უკანა მხარეს) ----------
function mountain(x, z, r, h, seed, snowAt = .7) {
  const g = new THREE.ConeGeometry(r, h, 14, 9, true); g.translate(0, h / 2, 0);
  const p = g.attributes.position, cols = new Float32Array(p.count * 3);
  for (let i = 0; i < p.count; i++) {
    let vx = p.getX(i), vy = p.getY(i), vz = p.getZ(i);
    const n = vnoise(vx * .35 + seed, vz * .35 + vy * .25) - .5, n2 = vnoise(vx * 1.1 + seed, vz * 1.1 + vy) - .5;
    vx *= 1 + n * .55 + n2 * .15; vz *= 1 + n * .55 + n2 * .15; vy *= 1 + n * .12;
    p.setXYZ(i, vx, vy, vz);
    const snow = vy > h * (snowAt + n2 * .15), g2 = .24 + n * .1;
    cols.set(snow ? [.9, .92, .96] : [g2 + .03, g2 + .025, g2 + .01], i * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(cols, 3)); g.computeVertexNormals();
  const m = new THREE.Mesh(g, M({ vertexColors: true, flatShading: true }));
  m.position.set(x, height(x, Math.max(-49, Math.min(z, -18))) - 1.2, z); m.castShadow = m.receiveShadow = true; scene.add(m);
}
for (let i = 0; i < 18; i++) mountain(-1 + i * 3.8 + rnd(-1, 1), -25 - rnd(0, 3), rnd(3.6, 5.2), rnd(4.5, 7), i * 7);
for (let i = 0; i < 13; i++) mountain(2 + i * 5.5 + rnd(-1.5, 1.5), -31 - rnd(0, 4), rnd(5, 7), rnd(7, 10), 100 + i * 7, .62);
for (let i = 0; i < 7; i++) mountain(-170 + i * 26, -175 - rnd(0, 25), rnd(22, 30), rnd(16, 24), 300 + i, .72);   // შორეული ბორცვები ზღვის გაღმა

// ---------- ცა, ღრუბლები, ვარსკვლავები ----------
const skyTex = (() => { const c = document.createElement('canvas'); c.width = 2; c.height = 256; const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#4f8fd0'); gr.addColorStop(.45, '#9cc6ea'); gr.addColorStop(.52, '#d6e8f2'); gr.addColorStop(1, '#d6e8f2'); g.fillStyle = gr; g.fillRect(0, 0, 2, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();
const sky = new THREE.Mesh(new THREE.SphereGeometry(900, 32, 16), new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false }));
scene.add(sky);
const puff = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  for (let i = 0; i < 14; i++) { const x = rnd(30, 98), y = rnd(50, 80), r = rnd(18, 34), gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, 'rgba(255,255,255,.9)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();
const clouds = [];
for (let i = 0; i < 9; i++) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: puff, transparent: true, opacity: .85, fog: false, depthWrite: false }));
  s.position.set(rnd(-220, 120), rnd(35, 70), rnd(-260, -180)); s.scale.set(rnd(70, 130), rnd(30, 50), 1); scene.add(s); clouds.push(s);
}
const starPos = [];
for (let i = 0; i < 700; i++) { const t = rnd(0, 6.28), p = rnd(.12, 1.4); starPos.push(Math.cos(t) * Math.cos(p) * 800, Math.sin(p) * 800, Math.sin(t) * Math.cos(p) * 800); }
const stars = new THREE.Points(new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3)),
  new THREE.PointsMaterial({ color: '#fff', size: 2.2, sizeAttenuation: false, transparent: true, opacity: 0, fog: false }));
scene.add(stars);

// ---------- სინათლე (მზე მარცხნიდან-უკნიდან, როგორც სურათზე) ----------
const hemi = new THREE.HemisphereLight('#d4e6f5', '#5a5030', 1.15); scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff0d6', 3);
sun.position.set(-45, 42, -22); sun.target.position.set(0, 0, 0); scene.add(sun.target);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 50, bottom: -50, near: 1, far: 160 });
sun.shadow.bias = -.0004; sun.shadow.normalBias = .03;
scene.add(sun);

// ---------- დღე / ღამე ----------
let night = 0, nightTarget = 0;
const C = c => new THREE.Color(c), lerpC = (a, b, k) => a.clone().lerp(b, k), L = THREE.MathUtils.lerp;
const SUN_D = C('#fff0d6'), SUN_N = C('#8fa8ff'), HS_D = C('#d4e6f5'), HS_N = C('#4a5e96'), HG_D = C('#5a5030'), HG_N = C('#1a1f30'), SKY_N = C('#1a2350');
function applyNight(k) {
  scene.fog.color.copy(lerpC(FOG_DAY, FOG_NIGHT, k));
  sky.material.color.copy(lerpC(C('#ffffff'), SKY_N, k));
  sun.intensity = L(3, 1.1, k); sun.color.copy(lerpC(SUN_D, SUN_N, k));
  hemi.intensity = L(1.15, .7, k); hemi.color.copy(lerpC(HS_D, HS_N, k)); hemi.groundColor.copy(lerpC(HG_D, HG_N, k));
  waterMat.color.copy(lerpC(WATER_DAY, WATER_NIGHT, k));
  stars.material.opacity = k;
  for (const c of clouds) c.material.opacity = L(.85, .15, k);
}
const nightBtn = document.getElementById('night');
nightBtn.onclick = () => { nightTarget = nightTarget ? 0 : 1; nightBtn.textContent = nightTarget ? '☀ დღე' : '☾ ღამე'; };
if (location.hash === '#night') { night = nightTarget = 1; nightBtn.textContent = '☀ დღე'; }
applyNight(night);

// ---------- ციკლი ----------
document.getElementById('loading').remove();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05);
  if (night !== nightTarget) { night = Math.min(1, Math.max(0, night + Math.sign(nightTarget - night) * dt * 1.2)); applyNight(night); }
  waterMat.normalMap.offset.x += dt * .004; waterMat.normalMap.offset.y += dt * .0025;
  renderer.render(scene, camera);
});
</script>
