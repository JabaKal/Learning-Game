<div class="lang">
  <button type="button" class="lang__btn" aria-haspopup="true" aria-expanded="false" data-i18n-attr="aria-label:header.changeLanguage">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 12 H21 M12 3 C15 6 15 18 12 21 C9 18 9 6 12 3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    <span class="lang__code"></span>
    <svg class="lang__chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 L6 8 L9.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <!-- სია „იზრდება“ ღილაკიდან: ზედა ზოლი იკავებს ღილაკის ადგილს -->
  <div class="lang__menu" role="menu">
    <button type="button" class="lang__head" data-i18n-attr="aria-label:header.closeLanguages">
      <span class="lang__title" data-i18n="header.language"></span>
      <span class="lang__now">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 12 H21 M12 3 C15 6 15 18 12 21 C9 18 9 6 12 3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        <span class="lang__code"></span>
        <svg class="lang__chev lang__chev--up" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 L6 8 L9.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </button>
    <div class="lang__list"></div>
  </div>
</div>
