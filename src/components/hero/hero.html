<section class="hero" id="home">
  <div class="hero__inner">
    <div class="hero__eyebrow" data-i18n="hero.eyebrow"></div>
    <h1 class="hero__title" data-i18n-html="hero.title"></h1>
    <div class="hero__divider" aria-hidden="true"><i></i><b></b><i></i></div>
    <p class="hero__lead">
      <span data-i18n-html="hero.lead"></span>
      <span class="hero__lead-2" data-i18n="hero.lead2"></span>
    </p>

    <!-- ერთი მინისებრი პანელი სამი რიგით (ოქროს გამყოფებით): „რას ვასწავლით“, „რა ენაზე ვასწავლით“, „როგორ ითამაშებ“.
         კომპიუტერზე — .teach (ორი პირველი რიგი); ტელეფონზე — .hero__mobile-teach (დროშების კაფსულა) და .hero__mobile-langs (ენები).
         სიებს ავსებს hero.js -->
    <div class="info-panel">
      <div class="hero__mobile-teach" data-list="mobileTeach" data-tips></div>
      <div class="teach" data-list="teach" data-tips></div>
      <div class="hero__mobile-langs" data-list="mobileLangs"></div>
      <div class="hero__modes-label" data-list="modesLabel"></div>
      <div class="hero__modes" data-list="modes"></div>
    </div>

    <div class="hero__chips" data-list="chips"></div>
  </div>
</section>
