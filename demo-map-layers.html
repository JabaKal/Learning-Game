<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>რუკა ფენებით — საცდელი</title>
<!-- საცდელი გვერდი (საიტს არ ეკუთვნის): ცარიელი რუკა (AI სურათი) + შენობები ცალკე სურათებად ზემოდან.
     შენობის ადგილი და ზომა — ცარიელი რუკის პიქსელებში (LAYERS), ამიტომ ნებისმიერ ეკრანზე თავის ადგილზე რჩება.
     წყარო: public/game/version 4/ (ჯერ — ეკრანის ანაბეჭდები, დაბალი გარჩევადობით). -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2a1b; font-family: system-ui, sans-serif; }
  .view { position: fixed; inset: 0; overflow: hidden; }
  .map { position: absolute; transform-origin: 0 0; transition: filter 1.2s ease; }
  .map > img.base { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }
  .night .map { filter: brightness(.45) saturate(.7) hue-rotate(15deg); }

  /* შენობა: სურათი + რბილი ჩრდილი მიწაზე (სინათლე მარცხნიდან → ჩრდილი მარჯვნივ) */
  .bld { position: absolute; padding: 0; border: 0; background: none; cursor: pointer; }
  .bld img { display: block; width: 100%; height: auto; pointer-events: none; user-select: none;
    filter: drop-shadow(6px 3px 4px rgba(20, 25, 10, .45)); transition: filter .25s ease, transform .25s ease; }
  .bld::before { content: ''; position: absolute; left: 6%; right: -2%; bottom: 2%; height: 30%; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(25, 30, 12, .45), transparent); filter: blur(4px); }
  .bld:hover img, .bld:focus-visible img { filter: drop-shadow(6px 3px 4px rgba(20, 25, 10, .45)) drop-shadow(0 0 6px rgba(255, 220, 140, .9)); transform: translateY(-1.5%); }
  .bld:focus-visible { outline: none; }

  .label { position: absolute; left: 50%; bottom: -6%; transform: translateX(-50%); white-space: nowrap; pointer-events: none;
    font-size: 15px; font-weight: 700; color: #f4e6c4; background: #2a2340e6; border: .07em solid #d9b46a; border-radius: 999px; padding: .27em .93em; }
  .ui { position: fixed; left: 16px; top: 16px; display: flex; gap: 8px; }
  button.tool { font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 999px; border: 1px solid #d9b46a; background: #2a2340e6; color: #f4e6c4; cursor: pointer; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 10px 18px; border-radius: 12px; background: #2a2340f2; color: #f4e6c4; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.on { opacity: 1; }
</style>
</head>
<body>
<div class="view" id="view">
  <div class="map" id="map"><img class="base" src="public/game/map-empty.webp" alt="" draggable="false"></div>
</div>
<div class="ui"><button class="tool" id="night">☾ ღამე</button></div>
<div class="toast" id="toast"></div>
<script>
// ცარიელი რუკის ზომა (პიქსელები) — ყველა კოორდინატი ამ სისტემაშია
const BASE = { w: 686, h: 375 };
// შენობები: x — ცენტრი, bottom — ქვედა კიდე (სადაც მიწას ეხება), w — სიგანე; ყველა — რუკის პიქსელებში
const LAYERS = [
  { id: 'castle', src: 'public/game/castle.webp', x: 468, bottom: 212, w: 190, label: 'პროფილი', text: 'პროფილი — მალე' }
];

const view = document.getElementById('view'), map = document.getElementById('map'), toast = document.getElementById('toast');
map.style.width = BASE.w + 'px'; map.style.height = BASE.h + 'px';
for (const L of LAYERS) {
  const b = document.createElement('button');
  b.className = 'bld'; b.type = 'button'; b.setAttribute('aria-label', L.label);
  b.style.left = (L.x - L.w / 2) + 'px'; b.style.width = L.w + 'px';
  b.innerHTML = `<img src="${L.src}" alt=""><span class="label">${L.label}</span>`;
  // სიმაღლე სურათის პროპორციით — ქვედა კიდე ზუსტად bottom-ზე
  b.querySelector('img').addEventListener('load', e => { const h = L.w * e.target.naturalHeight / e.target.naturalWidth; b.style.top = (L.bottom - h) + 'px'; }, { once: true });
  b.onclick = () => { toast.textContent = L.text; toast.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => toast.classList.remove('on'), 1800); };
  map.append(b);
}
// cover: რუკა მთელ ეკრანს ავსებს (ბუნდოვანი ზოლების გარეშე), ზედმეტი კიდე იჭრება; ax / ay — რომელი ნაწილი რჩება
const AX = .45, AY = .4;
function fit() {
  const w = view.clientWidth, h = view.clientHeight, k = Math.max(w / BASE.w, h / BASE.h);
  map.style.transform = `translate(${Math.round((w - BASE.w * k) * AX)}px, ${Math.round((h - BASE.h * k) * AY)}px) scale(${k})`;
  for (const l of map.querySelectorAll('.label')) l.style.fontSize = (15 / k) + 'px';      // წარწერა ყოველთვის ერთი ზომის
}
fit(); addEventListener('resize', fit);
document.getElementById('night').onclick = e => { const on = document.body.classList.toggle('night'); e.target.textContent = on ? '☀ დღე' : '☾ ღამე'; };
</script>
</body>
</html>
